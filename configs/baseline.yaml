# Plain baseline configuration for controlled comparison: paper-scale models
# with sampling-based decoding, HTML-based lookups, and TF32 disabled.

run:
  seed: 42
  device: auto          # auto | cuda | cpu
  tf32: false           # keep full float32 matmul precision
  output_root: outputs

retrieval:
  dbpedia_lookup: html      # scrape DBpedia resource pages
  wikipedia_lookup: html    # scrape Wikidata/Wikipedia HTML pages
  max_workers: 10
  timeout: 20
  retries: 3
  fuzzy_threshold: 0.8      # SequenceMatcher similarity threshold
  max_images_per_entity: 0  # no cap

captioning:
  backend: blip2
  model: Salesforce/blip2-flan-t5-xxl    # needs ~24 GB VRAM,
  quantization: none                     # or 8bit/4bit on smaller GPUs
  dtype: float16
  batch_size: 100                        # sized for a large GPU (H100)
  max_new_tokens: 100
  prompt: "Describe the scene, objects, colors, and other details in detail."

fusion:
  backend: causal
  model: mistralai/Mistral-7B-Instruct-v0.3   # best-performing LLM in the paper
  quantization: none                          # full bfloat16
  dtype: bfloat16
  max_descriptions_per_entity: 500
  priority_index: 0            # first --inputs file fills the cap first
  deterministic: false         # sampling-based decoding (temperature 0.6, top_p 0.9)
  temperature: 0.6
  top_p: 0.9
  max_new_tokens: 512

embedding:
  model: bert-base-uncased     # via sentence-transformers
  batch_size: 256
  text_key: auto               # fused summary if present, else merged captions
  tokens_model: bert-base-uncased
  max_token_length: 512
